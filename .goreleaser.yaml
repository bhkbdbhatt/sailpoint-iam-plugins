# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: sentinel

before:
  hooks:
    - go mod tidy

builds:
  - id: sentinel
    main: ./cmd/sentinel
    binary: sentinel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sentinel-iam/sentinel/internal/cli.version={{ .Version }}
      - -X github.com/sentinel-iam/sentinel/internal/cli.commit={{ .Commit }}
      - -X github.com/sentinel-iam/sentinel/internal/cli.date={{ .Date }}

archives:
  - id: sentinel
    ids: [sentinel]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - ARCHITECTURE.md
      - PLAN.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"
      - "merge conflict"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: true
  prerelease: auto
  name_template: "Sentinel {{ .Version }}"
  header: |
    ## Sentinel {{ .Version }}

    Thanks for trying the Sentinel beta! See CHANGELOG.md for details.
  footer: |
    **Full changelog**: https://github.com/sentinel-iam/sentinel/compare/{{ .PreviousTag }}...{{ .Tag }}
